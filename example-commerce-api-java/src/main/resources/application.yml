server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: example-commerce-api-java
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/commerce_java}
    username: ${DB_USER:commerce}
    password: ${DB_PASSWORD:commerce}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc.batch_size: 100
  sql:
    init:
      mode: always
      continue-on-error: false

commerce:
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  catalog-resource: classpath:catalog/catalog.json

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.vegasclubwear: INFO
---
# Run without Docker/Postgres:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:commerce;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
  h2:
    console:
      enabled: true
